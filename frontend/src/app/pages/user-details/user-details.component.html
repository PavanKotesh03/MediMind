<div class="center">
  <mat-card class="glass-card login-card">
    <h2>Tell us about you</h2>

    <mat-form-field appearance="outline">
      <mat-label>Name</mat-label>
      <input matInput [(ngModel)]="details.name">
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Age</mat-label>
      <input matInput type="number" [(ngModel)]="details.age">
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Gender</mat-label>
      <mat-select [(ngModel)]="details.gender">
        <mat-option value="Male">Male</mat-option>
        <mat-option value="Female">Female</mat-option>
        <mat-option value="Other">Other</mat-option>
      </mat-select>
    </mat-form-field>

    <button mat-raised-button color="accent" class="primary-btn full" (click)="submit()">
      Start Chat
    </button>
  </mat-card>
</div>
