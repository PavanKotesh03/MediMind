<div class="center">
  <mat-card class="glass-card auth-card">
    <h2>Create MediMind Account</h2>

    <mat-form-field appearance="outline">
      <input matInput placeholder="Name" [(ngModel)]="data.name">
    </mat-form-field>

    <mat-form-field appearance="outline">
      <input matInput placeholder="Age" type="number" [(ngModel)]="data.age">
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-select placeholder="Gender" [(ngModel)]="data.gender">
        <mat-option value="Male">Male</mat-option>
        <mat-option value="Female">Female</mat-option>
        <mat-option value="Other">Other</mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <input matInput placeholder="Email or Phone" [(ngModel)]="data.email">
    </mat-form-field>

    <mat-form-field appearance="outline">
      <input matInput placeholder="Password" type="password" [(ngModel)]="data.password">
    </mat-form-field>

    <mat-form-field appearance="outline">
      <input matInput placeholder="Confirm Password" type="password" [(ngModel)]="data.confirmPassword">
    </mat-form-field>

    <button class="primary-btn full" (click)="submit()">Sign Up</button>
  </mat-card>
</div>
