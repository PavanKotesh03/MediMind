<div class="chat-container">

  <!-- LEFT: HISTORY SIDEBAR -->
  <div class="sidebar-wrapper" [class.mobile-hidden]="!isSidebarOpen">
    <app-chat-history (sessionSelected)="loadConversation($event)" (newChatClicked)="startNewChat()">
    </app-chat-history>
  </div>

  <!-- RIGHT: CHAT AREA -->
  <div class="chat-wrapper" [class.mobile-hidden]="isSidebarOpen">
    <div class="chat-column">

      <div class="messages" #messagesContainer>
        <div *ngFor="let msg of messages" class="row" [class.user]="msg.role === 'user'">

          <div class="bubble" 
               [class.loading-bubble]="msg.loading" 
               [class.thinking-bubble]="msg.thinking"
               [class.final-bubble]="msg.isFinal">

            <!-- 🆕 THINKING INDICATOR (Simple) -->
            <ng-container *ngIf="msg.thinking">
              <div class="thinking-indicator">
                <span>Thinking</span>
                <span class="typing">
                  <span></span><span></span><span></span>
                </span>
              </div>
            </ng-container>

            <!-- NORMAL MESSAGE -->
            <ng-container *ngIf="!msg.loading && !msg.thinking && !msg.isFinal">
              <span style="white-space: pre-wrap;">{{ msg.content }}</span>
            </ng-container>

            <!-- FINAL ASSESSMENT -->
            <ng-container *ngIf="!msg.loading && !msg.thinking && msg.isFinal && msg.finalData">
              <div class="final-assessment">
                <h3>Assessment Complete</h3>

                <div class="assessment-item">
                  <strong>Condition:</strong> {{ msg.finalData.disease }}
                </div>

                <div class="assessment-item">
                  <strong>Severity:</strong>
                  <span [class.severity-high]="msg.finalData.severity === 'HIGH'"
                    [class.severity-medium]="msg.finalData.severity === 'MEDIUM'"
                    [class.severity-emergency]="msg.finalData.severity === 'EMERGENCY'">
                    {{ msg.finalData.severity }}
                  </span>
                </div>

                <div class="assessment-item">
                  <strong>Reason:</strong> {{ msg.finalData.reason }}
                </div>

                <div class="assessment-explanation">
                  <strong>Medical Explanation:</strong>
                  <p>{{ msg.finalData.explanation }}</p>
                </div>
              </div>
            </ng-container>

            <!-- LEGACY LOADING INDICATOR -->
            <ng-container *ngIf="msg.loading">
              <span class="typing">
                <span></span><span></span><span></span>
              </span>
            </ng-container>

          </div>
        </div>
      </div>

      <!-- INPUT BOX -->
      <div class="input-box">
        <!--  Show message for completed conversations -->
        <div *ngIf="conversationFinished" class="conversation-completed">
          <p>✓ This conversation is completed. Click "New Chat" to start fresh.</p>
        </div>

        <!--  Show input for active conversations -->
        <ng-container *ngIf="!conversationFinished">
          <textarea 
            [(ngModel)]="input" 
            placeholder="Please enter your symptoms" 
            (keydown)="handleKeydown($event)"
            [disabled]="isWaitingForResponse">
          </textarea>

          <button (click)="send()" [disabled]="isWaitingForResponse || !input.trim()">
            ➤
          </button>
        </ng-container>
      </div>

    </div>
  </div>

</div>
