<div class="form-wrapper">
  <div class="form-card">
    <h2>MediMind</h2>
    <p class="subtitle">Your AI Medical Assistant</p>

    <input
      type="text"
      name="name"
      placeholder="Name"
      [(ngModel)]="name"
    />

    <input
      type="number"
      name="age"
      placeholder="Age"
      [(ngModel)]="age"
      min="1"
    />

    <select
      name="gender"
      [(ngModel)]="gender"
    >
      <option value="">Select Gender</option>
      <option value="Male">Male</option>
      <option value="Female">Female</option>
      <option value="Other">Other</option>
    </select>

    <!-- ERROR MESSAGE -->
    <div class="error-popup" *ngIf="errorMessage">
      {{ errorMessage }}
    </div>

    <button type="button" (click)="submit()">
      Start Chat
    </button>
  </div>
</div>
